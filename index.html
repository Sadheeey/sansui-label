<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ラベル">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4f0">
<meta name="application-name" content="ラベル">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>ラベル発行</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#222;--sub:#777;--line:#e4e0d8;--main:#b23a2a;--ok:#2e7d4f;--ng:#c0392b;
  --frz:#2b6cb0;--frz-bg:#e8f1fb;--ref:#2f855a;--ref-bg:#e6f4ec;--amb:#b7791f;--amb-bg:#fbf1df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button,input{touch-action:manipulation} /* 連打してもズームしない */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:16px;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{flex:none;display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
header h1{flex:1;font-size:18px;font-weight:600;margin:0}
header a{font-size:13px;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:16px;padding:8px 16px;background:#fff}
nav{flex:none;padding:8px 16px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:8px 16px;font-size:14px;color:var(--sub)}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
nav .sep{flex:none;width:1px;background:var(--line);margin:0}
nav button.st{padding:8px 16px}
nav button.st::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px;background:var(--c)}
nav button.st.on{background:var(--c);border-color:var(--c)}
nav button.st.on::before{background:#fff}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:16px;margin-bottom:8px}
.card.s-冷凍{border-left-color:var(--frz)}
.card.s-冷蔵{border-left-color:var(--ref)}
.card.s-常温{border-left-color:var(--amb)}
.card.has{box-shadow:0 0 0 1px var(--main) inset}
.top{display:flex;align-items:center;gap:8px}
.nm{flex:1;min-width:0}
.nm b{font-size:17px;line-height:1.4;font-weight:600}
.nm small{display:block;color:var(--sub);font-size:13px;margin-top:0}
.tag{display:inline-block;font-size:11px;font-weight:500;border-radius:4px;padding:0 8px;margin-left:8px;vertical-align:2px}
.tag.s-冷凍{color:var(--frz);background:var(--frz-bg)}
.tag.s-冷蔵{color:var(--ref);background:var(--ref-bg)}
.tag.s-常温{color:var(--amb);background:var(--amb-bg)}
.step{display:flex;align-items:center;gap:8px;flex:none}
.step button{width:40px;height:48px;border-radius:8px;border:1px solid var(--line);background:#faf8f5;font-size:22px;line-height:1;color:var(--ink)}
.step input{width:48px;height:48px;text-align:center;font-size:20px;border:1px solid var(--line);border-radius:8px}
.spec{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.fl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.fl label{font-size:13px;color:var(--sub);min-width:32px}
.fl .w{width:80px;height:48px;font-size:20px;text-align:center;border:1px solid var(--line);border-radius:8px}
.fl .d{height:48px;font-size:17px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fff}
.fl .u{font-size:14px;color:var(--sub)}
.gr{display:flex;align-items:center;gap:8px;padding:8px 0}
.gr .gw{flex:1;font-size:18px;font-weight:600;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gr .gw small{font-size:13px;font-weight:normal;color:var(--sub)}
.gr .gw.kill{color:var(--ng)}
.gr .w{flex:none;width:80px;height:48px;font-size:20px;text-align:center;border:1px solid var(--line);border-radius:8px}
.gr .u{font-size:14px;color:var(--sub)}
.gr.has .gw{color:var(--main)}
.hint{font-size:12px;color:var(--sub);margin:8px 0 0}
#bar{flex:none;background:#fffaf2;border-top:1px solid var(--line);display:none}
#bar .hd{display:flex;align-items:center;gap:8px;padding:8px 16px}
#bar .hd .tx{flex:1;font-size:14px;line-height:1.35}
#bar .hd .tx small{display:block;color:var(--sub);font-size:12px}
#bar .tg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 16px;font-size:13px;color:var(--sub)}
#bar .ls{max-height:40vh;overflow-y:auto;padding:0 16px 8px;display:none}
#bar.open .ls{display:block}
#bar .nx{padding:8px 16px;min-height:40px;font-size:14px}
.cnt{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.add{margin-top:8px;border:1px dashed var(--line);background:none;border-radius:8px;padding:8px;width:100%;font-size:14px;color:var(--sub)}
.del{border:none;background:none;color:var(--sub);font-size:14px;padding:8px 0}
footer{flex:none;background:#fff;border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
footer .sum{flex:1;min-width:0;font-size:13px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer .sum small{display:block;font-size:12px;color:var(--sub)}
footer .btn{flex:none;white-space:nowrap}
footer .meta{flex-basis:100%;display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:0 16px;white-space:nowrap;font-size:12px;color:var(--sub)}
footer .meta a{color:var(--sub)}
footer .sum b{font-size:20px;font-weight:600}
#dev{font-size:12px;color:var(--sub);white-space:nowrap}
#ns{display:none;font-size:12px;color:var(--sub);white-space:nowrap}
#ns input{vertical-align:-2px;margin:0 4px 0 0}
#ns.on{color:var(--ng)}
#bar .un{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;font-size:12px;color:var(--sub)}
#bar .un.ask{border-color:var(--ng);color:var(--ng)}
.btn{border:none;border-radius:8px;padding:8px 16px;min-height:48px;font-size:16px;font-weight:600}
.btn.main{background:var(--main);color:#fff}
.btn.sub{background:#fff;border:1px solid var(--main);color:var(--main)}
.btn:disabled{opacity:.35}
#sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#sheet .in{background:#fff;width:100%;max-height:85%;overflow:auto;border-radius:16px 16px 0 0;padding:24px 16px calc(16px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 16px;font-size:18px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1}
.row .t small{display:block;color:var(--sub);font-size:12px}
.row .c{white-space:nowrap}
.row .s{white-space:nowrap;font-size:14px}
.row .x{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;font-size:13px;color:var(--sub)}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .btn{flex:1}
.msg{padding:8px 16px;border-radius:8px;margin:8px 0;font-size:14px;line-height:1.6;white-space:pre-line}
.msg.ng{background:#fdecea;color:var(--ng)}
.msg.warn{background:#fff6e0;color:#7a5600}
.msg.ok{background:#e8f5ec;color:var(--ok)}
#load{padding:40px 0;color:var(--sub)}
.pre{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px 40px}
.pre button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:8px 16px;font-size:13px;color:var(--ink)}
.pre button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#bar .rp{border:1px solid var(--main);background:#fff;border-radius:8px;padding:8px;font-size:12px;color:var(--main);margin-top:8px}
/* 細い線のアイコンと状態の点（絵文字は使わない） */
.ic{width:16px;height:16px;vertical-align:-3px;margin-right:4px;flex:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px;background:var(--sub)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--amb)}.dot.ng{background:var(--ng)}
</style>
</head>
<body>
<header><h1>ラベル発行</h1><a href="zaiko.html" id="zkLink">在庫カウンター</a></header>
<nav id="nav"></nav>
<main id="list"><div id="load">読み込み中…</div></main>
<div id="bar"><div class="hd" id="barHd"></div><div class="ls" id="barLs"></div></div>
<footer>
  <div class="meta"><span id="dev">店のPC 確認中…</span><label id="ns"><input type="checkbox" id="noStock">在庫に入れない</label></div>
  <div class="sum">合計 <b id="sumN">0</b> 枚<small><span id="sumK">0</span>件</small></div>
  <button class="btn sub" id="bStep" disabled>1種類ずつ</button>
  <button class="btn main" id="bAll" disabled>まとめて印刷</button>
</footer>
<div id="sheet"><div class="in" id="sheetIn"></div></div>

<script>
// 受付（Apps Script）の住所。このページを別の場所に置いたときは、ここへ送る
var EXEC = 'https://script.google.com/macros/s/AKfycbxVxiq_zZ6LFz_cWhz-RmKAFZ2ccub7rMukNTPgRcwmVwTB3gzC7A7fm0Pg1Ume7xG0/exec'; // リポジトリには書かない。公開するときに受付のURLへ置き換える（Apps Scriptから開くときは使わない）
var D = null;            // ui_data の結果
var Q = {};              // 入力。欄なし：id → 枚数／欄あり：id → {grid:{重さ:枚数}, rows:[{v:{欄名:値}, n:枚数}], d:{期限の欄名:'YYYY-MM-DD'}}
var QUEUE = [];          // 印刷に回したもの {title, spec, payload, held, id, st, note}
var SENDING = false, BAR_OPEN = false, BAR_ERR = '', timer = null, filter = '', sfilter = '';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function han(s){ return String(s).replace(/[０-９ｇ．]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }); }
function clampN(v){ v = parseInt(han(v), 10); if (!isFinite(v) || v < 0) v = 0; return Math.min(v, D ? D.maxCopies : 200); }
function store(k, v){ try { if (v === undefined) return localStorage.getItem('label:' + k); localStorage.setItem('label:' + k, v); } catch (e) { return null; } }

// 受付を呼ぶ：Apps Script の中で開いたときは google.script.run、別ページのときは fetch
var FN = { ui_data: 'uiData', ui_enqueue: 'uiEnqueue', ui_status: 'uiStatus', ui_cancel: 'uiCancel', ui_unstock: 'uiUnstock' };
function call(action, args, ok, ng){
  var fail = function(e){ (ng || showErr)(String(e && e.message || e)); };
  if (!(window.google && google.script && google.script.run) && EXEC.indexOf('__') === 0) { fail('受付の住所が入っていません（公開の手順を確かめてください）'); return; }
  if (window.google && google.script && google.script.run) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
    r[FN[action]].apply(r, args || []);
    return;
  }
  var body = { action: action };
  if (action === 'ui_enqueue') { body.items = args[0]; body.source = args[1]; }
  if (action === 'ui_status') body.ids = args[0];
  if (action === 'ui_cancel' || action === 'ui_unstock') body.id = args[0];
  fetch(EXEC, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
    .then(function(res){ if (!res.ok) throw new Error('受付につながりません（' + res.status + '）'); return res.json().catch(function(){ throw new Error('受付の返事が読めません。少しして、もう一度押してください'); }); })
    .then(ok).catch(fail);
}
function showErr(m){ openSheet('<h3>うまくいきませんでした</h3><div class="msg ng">' + esc(m) + '</div><div class="acts"><button class="btn sub" onclick="closeSheet()">閉じる</button></div>'); }

/* ---------- 日付 ---------- */
function ymd(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function addDays(n){ var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + (n || 0)); return ymd(d); }
// 期限の初期値：{n, unit:'d'|'m'}。月は「同じ日」（11/30＋3か月→2/28 のように月末に寄せる）
function addPeriod(l){
  var p = l.datePeriod || (l.dateDays != null ? { n: l.dateDays, unit: 'd' } : null);
  if (!p) return addDays(0);
  if (p.unit !== 'm') return addDays(p.n);
  var d = new Date(); d.setHours(12, 0, 0, 0);
  var day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + p.n);
  var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last)); return ymd(d);
}
// 期限のボタン（#16・11/23 北村さんの話）：冷凍は6か月、それ以外は 3日（催事）・15日・21日・1か月。ラベルの初期値も必ず出す
function presets(l){
  var base = l.storage === '冷凍' ? [{ n: 6, unit: 'm' }] : [{ n: 3, unit: 'd' }, { n: 15, unit: 'd' }, { n: 21, unit: 'd' }, { n: 1, unit: 'm' }];
  var p = l.datePeriod || (l.dateDays != null ? { n: l.dateDays, unit: 'd' } : null), out = [];
  if (p) out.push(p);
  base.forEach(function(b){ if (!out.some(function(x){ return x.n === b.n && x.unit === b.unit; })) out.push(b); });
  return out.sort(function(a, b){ return (a.unit === 'm' ? a.n * 30.5 : a.n) - (b.unit === 'm' ? b.n * 30.5 : b.n); });
}
function periodName(p){ return p.unit === 'm' ? p.n + 'か月' : p.n + '日'; }
function labelDate(s){ var p = String(s).split('-'); return p.length === 3 ? (p[0].slice(2) + '.' + Number(p[1]) + '.' + Number(p[2])) : ''; } // 2026-12-07 → 26.12.7（数字の全角は受付でそろえる）

/* ---------- 読み込み ---------- */
if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) { try { navigator.serviceWorker.register('sw.js').catch(function(){}); } catch (e) {} }
function load(){
  if (window.google && google.script && google.script.run) { var zl = $('zkLink'); if (zl) zl.style.display = 'none'; }
  call('ui_data', [], function(d){
    if (!d || !d.ok) { $('list').innerHTML = '<div class="msg ng">読み込めませんでした：' + esc(d && d.error) + '</div>'; return; }
    D = d; drawDev(d.device); applyDrafts(); drawNav(); draw(); sum();
    $('ns').style.display = d.labels.some(function(l){ return l.stock; }) ? 'inline-block' : 'none';
  }, function(m){ $('list').innerHTML = '<div class="msg ng">読み込めませんでした：' + esc(m) + '</div>'; });
}
// #24：Claudeが書いておいた本数（今日の分）を、入力が空のときだけ入れておく
var DRAFT_NOTE = '', DRAFT_ASK = false;   // 下書きが入ったときだけ、印刷の前に一覧を見せる（#16 検証役の指摘）
function applyDrafts(){
  DRAFT_NOTE = '';
  if (!D.drafts || !D.drafts.length || !D.labels.every(function(l){ return !count(l); })) return;
  var n = 0;
  D.drafts.forEach(function(x){
    var l = lab(x.label); if (!l) return;
    if (!l.fields.length) { Q[l.id] = clampN((Q[l.id] || 0) + x.copies); n += x.copies; return; }
    var gf = gridField(l); if (!gf) return;
    var w = han(String((x.values || {})[gf.name] || '')).replace(/[^0-9]/g, '');
    if (!/^[0-9]{1,4}$/.test(w) || Number(w) < 1) return;
    w = String(Number(w));
    var st = state(l);
    if (gridVals(l).indexOf(w) >= 0) st.grid[w] = clampN((st.grid[w] || 0) + x.copies);
    else {
      var r = st.rows.filter(function(y){ return String(y.v[gf.name]) === w; })[0];
      if (!r) { r = st.rows[st.rows.length - 1]; if (r.v[gf.name] || r.n) { r = newRow(l); st.rows.push(r); } r.v[gf.name] = w; }
      r.n = clampN((r.n || 0) + x.copies);
    }
    n += x.copies;
  });
  if (n) { DRAFT_NOTE = '本数が入っています（' + n + '枚）。確かめて印刷してください'; DRAFT_ASK = true; }
}
// 細い線のアイコン（16×16・線の太さ1.5）。絵文字の代わりに使う
var ICP = {
  ok: '<path d="M3 8.5l3 3 7-7"/>',
  ng: '<path d="M4 4l8 8M12 4l-8 8"/>',
  warn: '<path d="M8 2.5l6 11H2z"/><path d="M8 6.5v3.2M8 11.6v.2"/>',
  print: '<path d="M4.5 6V2.5h7V6"/><rect x="2" y="6" width="12" height="5.5" rx="1"/><path d="M4.5 9.5h7v4h-7z"/>',
  pause: '<path d="M6 3.5v9M10 3.5v9"/>',
  wait: '<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2 1.3"/>',
  note: '<path d="M10.5 2.5l3 3-7.5 7.5H3v-3z"/>',
  x: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>'
};
function ic(n){ return '<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICP[n] + '</svg>'; }
// 受付のメモの頭に付く印（プリンター・一時停止の絵文字）は画面では外して出す
function cleanNote(n){ return String(n || '').replace(/^[\u{1F5A8}\u23F8]\uFE0F?\s*/u, ''); }
function drawDev(dv){
  var s = dv && dv.secondsAgo, t;
  if (s == null) t = '<span class="dot ng"></span>店のPC 不明';
  else if (s <= 30) t = '<span class="dot ok"></span>店のPC 正常';
  else if (s <= 300) t = '<span class="dot warn"></span>店のPC ' + Math.round(s / 60 + 0.5) + '分前';
  else t = '<span class="dot ng"></span>店のPC 応答なし';
  $('dev').innerHTML = t;
  $('dev').dataset.bad = (s == null || s > 300) ? '1' : '';
}
// 絞り込みのボタンは短い名前にする（横に並べても場所をとらないように）
var SHORT = { '生ベーコン': 'ベーコン', '食べる焼豚タレ': 'タレ', '半熟味玉': '味玉', '醤蘿蔔': '大根', 'はしのはし': 'はし' };
var STORES = [['冷凍', 'var(--frz)'], ['冷蔵', 'var(--ref)'], ['常温', 'var(--amb)']];
function group(l){ var k = String(l.item || 'その他').replace(/（.*$/, '').replace(/\(.*$/, ''); return SHORT[k] || k; }
function shown(l){ return (!filter || group(l) === filter) && (!sfilter || l.storage === sfilter); }
function groups(){ var m = [], seen = {}; D.labels.forEach(function(l){ var k = group(l); if (!seen[k]) { seen[k] = 1; m.push(k); } }); return m; }
function drawNav(){
  var h = '';
  STORES.forEach(function(x){ h += '<button class="st' + (sfilter === x[0] ? ' on' : '') + '" style="--c:' + x[1] + '" data-s="' + x[0] + '">' + x[0] + '</button>'; });
  h += '<span class="sep"></span><button class="' + (filter ? '' : 'on') + '" data-k="">全部</button>';
  groups().forEach(function(k){ h += '<button class="' + (filter === k ? 'on' : '') + '" data-k="' + esc(k) + '">' + esc(k) + '</button>'; });
  $('nav').innerHTML = h;
}
$('nav').onclick = function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.s) sfilter = sfilter === b.dataset.s ? '' : b.dataset.s; // もう一度押すと解除
  else filter = b.dataset.k;
  drawNav(); draw(); $('list').scrollTop = 0;
};

/* ---------- 一覧 ---------- */
function lab(id){ for (var i = 0; i < D.labels.length; i++) if (D.labels[i].id === id) return D.labels[i]; return null; }
function numFields(l){ return l.fields.filter(function(f){ return f.kind === 'number'; }); }
function dateFields(l){ return l.fields.filter(function(f){ return f.kind === 'date'; }); }
// よく使う重さの一覧（数字の欄が1つだけのラベル）。軽い順、このスマホで消したものは出さない
function gridField(l){ var n = numFields(l); return n.length === 1 ? n[0] : null; }
function hidden(l, f){ try { return JSON.parse(store('hide:' + l.id + ':' + f.name) || '[]'); } catch (e) { return []; } }
function gridVals(l){
  var f = gridField(l); if (!f) return [];
  var hide = hidden(l, f);
  // 決めた候補（ラベル一覧のR列）は書いた順で先に、最近使った重さはその後ろに小さい順で
  var fixed = (f.choices || []).map(String);
  var more = (f.recent || []).map(String).filter(function(v){ return fixed.indexOf(v) < 0; }).sort(function(a, b){ return Number(a) - Number(b); });
  return fixed.concat(more).filter(function(v){ return Number(v) >= 1 && hide.indexOf(v) < 0; });
}
function newRow(l){ var v = {}; numFields(l).forEach(function(f){ v[f.name] = ''; }); return { v: v, n: 0 }; }
function state(l){
  if (!Q[l.id]) {
    var d = {}; dateFields(l).forEach(function(f){ d[f.name] = addPeriod(l); });
    Q[l.id] = { grid: {}, rows: [newRow(l)], d: d };
  }
  return Q[l.id];
}
function draw(){
  var h = '';
  D.labels.forEach(function(l){ if (shown(l)) h += card(l); });
  $('list').innerHTML = (DRAFT_NOTE ? '<div class="msg ok">' + ic('note') + esc(DRAFT_NOTE) + '</div>' : '') + (h || '<div class="msg warn">出せるラベルがありません</div>');
}
function card(l){
  var fixed = !l.fields.length && l.content && l.content.charAt(0) !== '（' ? han(l.content).replace(/\s/g, '') : '';
  var h = '<div class="card s-' + esc(l.storage) + (count(l) ? ' has' : '') + '" id="c_' + l.id + '" data-id="' + l.id + '"><div class="top"><div class="nm"><b>' + esc(l.name) + '</b>' +
    (l.storage ? '<span class="tag s-' + esc(l.storage) + '">' + esc(l.storage) + '</span>' : '') + (fixed ? '<small>' + esc(fixed) + '</small>' : '') + '</div>';
  if (!l.fields.length) return h + stepper(Q[l.id] || 0, 'one', '') + '</div></div>';
  h += '</div>';
  var q = state(l), gf = gridField(l), gv = gridVals(l);
  dateFields(l).forEach(function(f){
    h += '<div class="fl" style="margin-top:8px"><label>' + esc(f.name) + '</label><input class="d" type="date" data-f="' + esc(f.name) + '" value="' + esc(q.d[f.name]) + '"><span class="u">' + esc(labelDate(q.d[f.name])) + '</span></div>';
    if (/期限/.test(f.name)) h += '<div class="pre">' + presets(l).map(function(p){
      var v = addPeriod({ datePeriod: p });
      return '<button data-pre="' + esc(f.name) + '" data-v="' + v + '" class="' + (q.d[f.name] === v ? 'on' : '') + '">＋' + periodName(p) + '</button>';
    }).join('') + '</div>';
  });
  if (gv.length) {
    h += '<div class="spec">';
    gv.forEach(function(v){
      var n = q.grid[v] || 0;
      h += '<div class="gr' + (n ? ' has' : '') + '"><span class="gw" data-gv="' + esc(v) + '">' + esc(v) + '<small>' + esc(gf.unit || '') + '</small></span>' + stepper(n, 'grid', v) + '</div>';
    });
    h += '<div class="hint">ほかの' + esc(gf.name) + '（長押しで上の候補を消せます）</div></div>';
  }
  var rows = q.rows;
  rows.forEach(function(r, i){
    h += '<div class="' + (gv.length ? '' : 'spec ') + 'rw" data-i="' + i + '"><div class="gr">';
    numFields(l).forEach(function(f){
      h += '<input class="w" inputmode="numeric" autocomplete="off" data-f="' + esc(f.name) + '" value="' + esc(r.v[f.name]) + '" placeholder="' + esc(f.name) + '"><span class="u">' + esc(f.unit || '') + '</span>';
    });
    h += '<span style="flex:1"></span>' + stepper(r.n, 'row', i) + '</div>' + (rows.length > 1 ? '<button class="del" data-del="' + i + '">' + ic('x') + 'この行をけす</button>' : '') + '</div>';
  });
  if (numFields(l).length) h += '<button class="add">＋ 別の' + esc(numFields(l)[0].name) + 'を足す</button>';
  return h + '</div>';
}
function stepper(n, kind, key){
  return '<div class="step" data-k="' + kind + '" data-key="' + esc(key) + '"><button data-d="-1">−</button><input class="n" inputmode="numeric" autocomplete="off" value="' + (n || '') + '" placeholder="0"><button data-d="1">＋</button></div>';
}
function count(l){
  var q = Q[l.id]; if (!q) return 0; if (!l.fields.length) return q;
  var s = 0; for (var k in q.grid) s += q.grid[k] || 0;
  q.rows.forEach(function(r){ s += r.n || 0; }); return s;
}
function redrawCard(id){ var el = $('c_' + id); if (el) el.outerHTML = card(lab(id)); }
function setCount(l, kind, key, n){
  if (kind === 'one') Q[l.id] = n;
  else if (kind === 'grid') state(l).grid[key] = n;
  else state(l).rows[Number(key)].n = n;
}
function getCount(l, kind, key){
  if (kind === 'one') return Q[l.id] || 0;
  if (kind === 'grid') return state(l).grid[key] || 0;
  return state(l).rows[Number(key)].n || 0;
}

// 一覧の中の操作はここでまとめて受ける
$('list').addEventListener('click', function(e){
  var c = e.target.closest('.card'); if (!c) return;
  var l = lab(c.dataset.id);
  var gw = e.target.closest('.gw');
  if (gw && Date.now() - (window.__killAt || 0) < 500) return; // 長押しで指を離したときの1回は数えない
  if (gw && gw.classList.contains('kill')) { // 長押しのあと、もう一度押すと候補から消す
    var f = gridField(l), list = hidden(l, f); list.push(gw.dataset.gv); store('hide:' + l.id + ':' + f.name, JSON.stringify(list));
    delete state(l).grid[gw.dataset.gv]; redrawCard(l.id); sum(); return;
  }
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d) {
    var st = b.closest('.step'); setCount(l, st.dataset.k, st.dataset.key, clampN(getCount(l, st.dataset.k, st.dataset.key) + Number(b.dataset.d)));
  } else if (b.dataset.del != null) {
    state(l).rows.splice(Number(b.dataset.del), 1);
  } else if (b.classList.contains('add')) {
    state(l).rows.push(newRow(l));
  } else if (b.dataset.pre) {
    state(l).d[b.dataset.pre] = b.dataset.v;

  redrawCard(l.id); sum();
});
$('list').addEventListener('input', function(e){
  var c = e.target.closest('.card'); if (!c) return;
  var l = lab(c.dataset.id), t = e.target;
  if (t.classList.contains('n')) {
    var st = t.closest('.step'), n = clampN(t.value);

    if (t.value !== '' && String(n) !== t.value) t.value = n || '';

    c.classList.toggle('has', count(l) > 0);
  } else if (t.classList.contains('w')) {
    var i = Number(t.closest('.rw').dataset.i), v = han(t.value).replace(/[^0-9]/g, '').slice(0, 4);
    state(l).rows[i].v[t.dataset.f] = v;
    if (t.value !== v) t.value = v;
  } else if (t.classList.contains('d')) {
    state(l).d[t.dataset.f] = t.value;
    t.nextElementSibling.textContent = labelDate(t.value);
    var pr = t.closest('.fl').nextElementSibling;
    if (pr && pr.classList.contains('pre')) [].forEach.call(pr.querySelectorAll('button'), function(x){ x.classList.toggle('on', x.dataset.v === t.value); });
  }
  sum();
});
// 数字の欄を触ったら中身を消して、すぐ打ち直せるようにする
$('list').addEventListener('focusin', function(e){
  var t = e.target;
  if (!t.classList.contains('n') && !t.classList.contains('w')) return;
  if (t.value === '') return;
  t.dataset.prev = t.value; t.value = '';
  t.dispatchEvent(new Event('input', { bubbles: true }));
});
$('list').addEventListener('focusout', function(e){
  var t = e.target;
  if ((t.classList.contains('n') || t.classList.contains('w')) && t.value === '' && t.dataset.prev) {
    t.value = t.dataset.prev; t.dispatchEvent(new Event('input', { bubbles: true }));
  }
  if (t.dataset) delete t.dataset.prev;
});
// 候補を長押しすると「消す？」に変わる（3秒以内にもう一度押すと消える）
var pressT = null, pressXY = null;
function pt(e){ var t = e.touches ? e.touches[0] : e; return t ? [t.clientX, t.clientY] : [0, 0]; }
function pressStart(e){
  var gw = e.target.closest('.gw'); if (!gw || gw.classList.contains('kill')) return;
  clearTimeout(pressT); pressXY = pt(e);
  pressT = setTimeout(function(){
    window.__killAt = Date.now(); window.__pressFired = true; gw.classList.add('kill'); gw.dataset.txt = gw.innerHTML; gw.innerHTML = ic('x') + '消す？ ' + esc(gw.dataset.gv);
    setTimeout(function(){ if (gw.isConnected && gw.classList.contains('kill')) { gw.classList.remove('kill'); gw.innerHTML = gw.dataset.txt; } }, 3000);
  }, 600);
}
function pressEnd(){ clearTimeout(pressT); if (window.__pressFired) { window.__killAt = Date.now(); window.__pressFired = false; } }
$('list').addEventListener('touchstart', pressStart, { passive: true });
$('list').addEventListener('mousedown', pressStart);
['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(function(ev){ $('list').addEventListener(ev, pressEnd); });
$('list').addEventListener('touchmove', function(e){ // 10px以上動いたら（スクロール）長押しをやめる
  if (!pressXY) return; var p = pt(e); if (Math.abs(p[0] - pressXY[0]) > 10 || Math.abs(p[1] - pressXY[1]) > 10) clearTimeout(pressT);
}, { passive: true });
$('list').addEventListener('contextmenu', function(e){ if (e.target.closest('.gw')) e.preventDefault(); });

/* ---------- 集める ---------- */
function collect(){
  var out = [], bad = [];
  D.labels.forEach(function(l){
    var q = Q[l.id]; if (!q) return;
    if (!l.fields.length) { if (q > 0) out.push({ label: l.id, values: {}, copies: q, title: l.name, spec: l.storage || '' }); return; }
    var dates = {}, dspec = [], dmiss = '';
    dateFields(l).forEach(function(f){ var x = labelDate(q.d[f.name]); if (!x) dmiss = dmiss || f.name; dates[f.name] = x; dspec.push(f.name + ' ' + x); });
    var push = function(nv, n, wspec){
      var v = {}; for (var k in nv) v[k] = nv[k]; for (var k2 in dates) v[k2] = dates[k2];
      out.push({ label: l.id, values: v, copies: n, title: l.name, spec: [wspec].concat(dspec).filter(Boolean).join('・') });
    };
    var gf = gridField(l);
    gridVals(l).forEach(function(gv){
      var n = q.grid[gv] || 0; if (!n) return;
      if (dmiss) { bad.push(l.name + '：' + dmiss + 'が入っていません'); return; }
      var nv = {}; nv[gf.name] = String(gv); push(nv, n, gv + (gf.unit || ''));
    });
    q.rows.forEach(function(r){
      if (!r.n) return;
      var miss = dmiss, ws = [];
      numFields(l).forEach(function(f){ var x = r.v[f.name]; if (!/^[0-9]{1,4}$/.test(x || '') || Number(x) < 1) miss = miss || f.name; else ws.push(x + (f.unit || '')); });
      if (miss) { bad.push(l.name + '：' + miss + 'が入っていません'); return; }
      push(r.v, r.n, ws.join('・'));
    });
  });
  return { items: out, bad: bad };
}
function sum(){
  if (!D) return;
  var c = collect(), n = c.items.reduce(function(a, x){ return a + x.copies; }, 0);
  $('sumN').textContent = n; $('sumK').textContent = c.items.length;
  $('bAll').disabled = $('bStep').disabled = !(n > 0 || c.bad.length); // 入れ忘れは押したときに知らせる
}

/* ---------- 印刷（#16：確認画面なし。押したらすぐ並べる） ---------- */
$('bAll').onclick = function(){ run('all'); };
$('noStock').onchange = function(){ $('ns').classList.toggle('on', this.checked); };
$('bStep').onclick = function(){ run('step'); };
function run(mode, ok){
  var c = collect();
  if (c.bad.length) { showErr(c.bad.join('\n')); return; }
  if (!c.items.length) return;
  var ns = $('noStock').checked && $('ns').style.display !== 'none';
  if (DRAFT_ASK && !ok) {
    var n = c.items.reduce(function(a, x){ return a + x.copies; }, 0);
    var h = '<h3>入っていた本数で印刷します（合計 ' + n + ' 枚）</h3>';
    c.items.forEach(function(x){ h += '<div class="row"><div class="t">' + esc(x.title) + '<small>' + esc(x.spec) + '</small></div><div class="c">' + x.copies + ' 枚</div></div>'; });
    h += '<div class="acts"><button class="btn sub" onclick="closeSheet()">戻る</button><button class="btn main" onclick="closeSheet();run(\'' + mode + '\',true)">印刷する</button></div>';
    openSheet(h); return;
  }
  DRAFT_ASK = false;
  // 前の印刷で済んだ分は、ここで帯から下ろす（それまでは「在庫から外す」を押せる）
  QUEUE = QUEUE.filter(function(x){ return !(isEnd(x.st) && (!part(x) || x.rp)) && !x.gone; });
  LAST_HD = LAST_LS = '';
  c.items.forEach(function(x, i){
    var st = ns && (lab(x.label) || {}).stock;
    QUEUE.push({ title: x.title, spec: x.spec + (st ? '・在庫に入れない' : ''), copies: x.copies, payload: { label: x.label, values: x.values, copies: x.copies, noStock: !!st }, held: mode === 'step' && i > 0, id: null, st: '', note: '' });
  });
  Q = {}; DRAFT_NOTE = ''; $('noStock').checked = false; $('ns').classList.remove('on'); draw(); sum(); // 印刷中でも、すぐ次を入れられる
  sendPending();
}

/* ---------- 印刷の様子（下の帯） ---------- */
function sendPending(){
  if (SENDING) return;
  var list = QUEUE.filter(function(x){ return !x.held && !x.retry && !x.id && !x.gone; }).slice(0, 50); // 受付は1回50件まで
  if (!list.length) { drawBar(); return; }
  SENDING = true; list.forEach(function(x){ x.sending = true; }); drawBar();
  call('ui_enqueue', [list.map(function(x){ return x.payload; }), '画面'], function(r){
    SENDING = false;
    list.forEach(function(x){ x.sending = false; });
    if (!r || !r.ok) { failSend(r && r.error, false); return; }
    list.forEach(function(x, i){ x.id = r.ids[i]; x.st = '待ち'; });
    BAR_ERR = ''; POLL_WAIT = 3000; STILL = 0; sendPending(); poll();
  }, function(m){ SENDING = false; list.forEach(function(x){ x.sending = false; }); failSend(m, true); });
}
// 送れなかった分は「送り直し待ち」にする（自動では送り直さない）。
// 通信が切れたときは、実は受付に届いていることがあるので、二重に刷らないよう注意を出す
function failSend(m, unsure){
  QUEUE.forEach(function(x){ if (!x.id && !x.gone && !x.held) x.retry = true; });
  BAR_ERR = unsure ? '通信が切れました。届いたか分かりません。店のPCで出ていないか確かめてから「送り直す」を押してください'
                   : (m || '送れませんでした');
  BAR_OPEN = true; drawBar();
}
function resend(){ if (SENDING) return; QUEUE.forEach(function(x){ x.retry = false; }); BAR_ERR = ''; sendPending(); }
function isEnd(s){ return s === '済み' || s === '失敗' || s === '取消' || s === '不明'; }
var POLL_WAIT = 3000, STILL = 0;
function poll(){
  clearTimeout(timer);
  var ids = QUEUE.filter(function(x){ return x.id && !isEnd(x.st); }).map(function(x){ return x.id; });
  if (!ids.length) { drawBar(); return; }
  call('ui_status', [ids], function(r){
    var jobs = (r && r.jobs) || {}, changed = false;
    QUEUE.forEach(function(x){
      if (!x.id || isEnd(x.st)) return;
      if (jobs[x.id]) { if (x.st !== jobs[x.id].status) changed = true; x.st = jobs[x.id].status; x.note = jobs[x.id].note; }
      else if (r && r.ok) { x.st = '不明'; changed = true; } // 依頼の行が見つからない分は追わない
    });
    STILL = changed ? 0 : STILL + 1;
    POLL_WAIT = STILL < 20 ? 3000 : Math.min(POLL_WAIT * 2, 30000); // 1分ほど動きがないときだけ間隔を延ばす（PCが止まっているとき）
    drawDev(r && r.device); drawBar();
    timer = setTimeout(poll, POLL_WAIT);
  }, function(){ POLL_WAIT = Math.min(POLL_WAIT * 2, 30000); timer = setTimeout(poll, POLL_WAIT); });
}
var MARK = { '待ち': ic('wait') + '待ち', '印刷中': ic('print') + '印刷中', '済み': ic('ok') + '済み', '失敗': '<span style="color:var(--ng)">' + ic('ng') + '失敗</span>', '取消': '取消', '不明': ic('warn') + '不明' };
var LAST_HD = '', LAST_LS = '';
function live(){ return QUEUE.filter(function(x){ return !x.gone; }); }
function drawBar(){
  var q = live(), bar = $('bar');
  if (!q.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'block'; bar.classList.toggle('open', BAR_OPEN);
  var done = q.filter(function(x){ return x.st === '済み'; }).length;
  var held = q.filter(function(x){ return x.held; });
  var retry = q.filter(function(x){ return x.retry; });
  var bad = q.filter(function(x){ return x.st === '失敗' || x.st === '不明'; });
  var busy = q.some(function(x){ return x.sending || (x.id && !isEnd(x.st)) || (!x.id && !x.held && !x.retry); });
  var sheets = q.filter(function(x){ return x.st === '済み'; }).reduce(function(a, x){ var p = part(x); return a + (p ? p.n : x.copies); }, 0);
  var parts = q.filter(function(x){ return part(x) && !x.rp; });
  var paused = q.filter(function(x){ return x.st === '印刷中' && /^⏸/.test(x.note || ''); });
  if (!paused.length) PAUSE_SHOWN = false;
  var tx, acts = '';
  if (retry.length) {
    tx = ic('warn') + '送れていない分が ' + retry.length + '件 あります';
    acts = '<button class="btn main nx" ' + (SENDING ? 'disabled' : '') + ' onclick="resend()">送り直す</button>';
  } else if (!busy && !held.length) {
    tx = bad.length ? '<span style="color:var(--ng)">' + ic('ng') + bad.length + '件 うまく刷れていません</span>（済み ' + done + '/' + q.length + '件）'
      : parts.length ? ic('warn') + '途中で止まった分があります（' + sheets + '枚 刷れました）'
      : ic('ok') + '全部おわりました（' + done + '/' + q.length + '件・' + sheets + '枚）';
    if (bad.length || parts.length) BAR_OPEN = true;
    acts = '<button class="btn sub nx" onclick="clearBar()">閉じる</button>';
  } else if (paused.length) {
    tx = ic('pause') + 'プリンターが止まっています<small style="color:var(--ng)">ラベル切れかもしれません。ロールを替えると、続きから刷ります</small>';
    if (!PAUSE_SHOWN) { PAUSE_SHOWN = true; BAR_OPEN = true; }
  } else {
    tx = ic('print') + '印刷：済み ' + done + '/' + q.length + '件' + (held.length ? '<small>次：' + esc(held[0].title) + ' ' + esc(held[0].spec) + ' ×' + held[0].copies + '</small>' : '');
    if (held.length) acts = '<button class="btn main nx" ' + (SENDING ? 'disabled' : '') + ' onclick="nextOne()">次を印刷</button>';
  }
  var nostock = q.filter(function(x){ return x.st === '済み' && String(x.note || '').indexOf('在庫に入れられません') >= 0; });
  if (nostock.length) { tx += '<small style="color:var(--ng)"><span class="dot ng"></span>' + nostock.length + '件 在庫に入れられませんでした（刷れています）。Claudeに知らせてください</small>'; BAR_OPEN = true; }
  if (busy && $('dev').dataset.bad) tx += '<small style="color:var(--ng)">店のPCとつながっていないようです。PCが動くまで印刷されません</small>';
  if (BAR_ERR) tx += '<small style="color:var(--ng)">' + esc(BAR_ERR) + '</small>';
  var stocked = q.some(function(x){ var n = String(x.note || ''); return x.st === '済み' && n.indexOf('［在庫+］') >= 0 && n.indexOf('［在庫−］') < 0; });
  autoClose(!busy && !held.length && !retry.length && !bad.length && !parts.length && !nostock.length && !BAR_ERR && !stocked);
  var hd = '<div class="tx">' + tx + '</div>' + acts + '<button class="tg" onclick="toggleBar()">' + (BAR_OPEN ? '一覧をたたむ' : '一覧を見る') + '</button>';
  if (hd !== LAST_HD) { $('barHd').innerHTML = hd; LAST_HD = hd; } // 中身が同じなら作り直さない（押している最中に消えないように）
  bar.classList.toggle('open', BAR_OPEN);
  var h = '';
  q.forEach(function(x, i){
    var s = x.retry ? ic('warn') + '送り直し待ち' : x.held ? ic('pause') + '次を待つ' : x.sending ? '送信中' : x.cancelling ? '取消中' : (Object.prototype.hasOwnProperty.call(MARK, x.st) ? MARK[x.st] : esc(x.st || '…'));
    var canX = !x.cancelling && (x.held || x.retry || x.st === '待ち');
    var inS = x.st === '済み' && String(x.note || '').indexOf('［在庫+］') >= 0, outS = String(x.note || '').indexOf('［在庫−］') >= 0;
    var tag = outS ? '・在庫から外した' : inS ? '・在庫に入れた' : '';
    var un = inS && !outS && !x.unstocking ? '<button class="un' + (x.askUn ? ' ask' : '') + '" onclick="unstockOne(' + QUEUE.indexOf(x) + ')">' + (x.askUn ? 'もう一度押すと外す' : '在庫から外す') + '</button>' : '';
    var pt = part(x), k = QUEUE.indexOf(x), sub = '';
    if (x.st === '印刷中' && x.note) sub = ' ' + cleanNote(x.note);
    if (x.st === '失敗' && x.note) sub = ' ' + cleanNote(x.note);
    if (pt) {
      sub = ' 途中で止まりました：' + pt.n + '/' + pt.of + '枚 刷れました' + (pt.unsure ? '。止まったときの1枚が出ていたら、それは使わないでください（残りに入っています）' : '');
      if (x.rp) sub += '（' + x.rp + '）';
    }
    var rp = '';
    if (pt && !x.rp && pt.of > pt.n) {
      var left = pt.of - pt.n;
      rp = '<br><button class="rp" onclick="reprint(' + k + ',' + left + ')">残り' + left + '枚を刷る</button> <button class="rp" style="border-color:var(--sub);color:var(--sub)" onclick="reprint(' + k + ',0)">刷らない</button>';
    }
    h += '<div class="row"><div class="t">' + esc(x.title) + '<small' + (x.st === '印刷中' && /^⏸/.test(x.note || '') || (pt && !x.rp) ? ' style="color:var(--ng)"' : '') + '>' + esc(x.spec) + esc(tag) + esc(sub) + '</small>' + rp + '</div><div class="c">' + x.copies + ' 枚</div><div class="s">' + (pt ? ic('warn') + '途中' : s) + '</div>' +
      (canX ? '<button class="x" onclick="cancelOne(' + k + ')">取消</button>' : '') + un + '</div>';
  });
  if (h !== LAST_LS) { $('barLs').innerHTML = h; LAST_LS = h; }
}
function toggleBar(){ BAR_OPEN = !BAR_OPEN; drawBar(); }
// 途中で止まった印（受付が結果メモに付ける）：［途中 40/160枚］［1枚不明］
function part(x){
  if (x.st !== '済み') return null;
  var m = String(x.note || '').match(/［途中 (\d+)\/(\d+)枚］/);
  return m ? { n: Number(m[1]), of: Number(m[2]), unsure: String(x.note).indexOf('［1枚不明］') >= 0 } : null;
}
// 残りを刷る（n=0 は刷らない）。在庫に入れない設定は元の依頼のまま
function reprint(k, n){
  var x = QUEUE[k]; if (!x || x.rp) return;
  x.rp = n > 0 ? '残り' + n + '枚を並べた' : '刷らない';
  if (n > 0) QUEUE.push({ title: x.title, spec: x.spec + '・残り', copies: n, payload: { label: x.payload.label, values: x.payload.values, copies: n, noStock: x.payload.noStock }, held: false, id: null, st: '', note: '' });
  LAST_HD = LAST_LS = ''; sendPending(); drawBar();
}
// 全部うまく済んだら、10秒で帯を自動で閉じる（一覧を開いているとき・途中で止まった分があるときは閉じない）
var AUTO_T = null, PAUSE_SHOWN = false;
function autoClose(ok){
  if (!ok || BAR_OPEN) { clearTimeout(AUTO_T); AUTO_T = null; return; }
  if (AUTO_T) return;
  AUTO_T = setTimeout(function(){ AUTO_T = null; if (!BAR_OPEN && live().every(function(x){ return isEnd(x.st) && !part(x) || x.rp; })) { clearTimeout(timer); QUEUE = []; BAR_ERR = ''; LAST_HD = LAST_LS = ''; drawBar(); } }, 10000);
}
function nextOne(){
  if (SENDING) return;
  var x = QUEUE.filter(function(y){ return y.held && !y.gone; })[0]; if (!x) return;
  x.held = false; BAR_ERR = ''; sendPending();
}
function cancelOne(k){
  var x = QUEUE[k]; if (!x) return;
  if (x.held || x.retry) { x.gone = true; drawBar(); return; }   // まだ送っていない分は、ここで消すだけ
  if (x.st !== '待ち' || x.cancelling) return;
  x.cancelling = true; drawBar();
  call('ui_cancel', [x.id], function(r){ x.cancelling = false; if (r && r.ok) x.st = '取消'; BAR_ERR = r && r.ok ? '' : (r && r.error) || ''; POLL_WAIT = 3000; poll(); },
    function(m){ x.cancelling = false; BAR_ERR = m; poll(); });
}
// 刷り間違い・試し刷りの入れ忘れ：その日に刷った分を在庫から外す（2回押す）
function unstockOne(k){
  var x = QUEUE[k]; if (!x || x.unstocking) return;
  if (!x.askUn || Date.now() - x.askUn > 3000) { x.askUn = Date.now(); drawBar(); setTimeout(function(){ if (x.askUn && Date.now() - x.askUn >= 3000) { x.askUn = 0; drawBar(); } }, 3100); return; }
  x.askUn = 0; x.unstocking = true; drawBar();
  call('ui_unstock', [x.id], function(r){
    x.unstocking = false;
    if (r && r.ok || /もう在庫から外して/.test(r && r.error || '')) { x.note = '［在庫−］' + (x.note || ''); BAR_ERR = ''; } else BAR_ERR = (r && r.error) || '外せませんでした';
    drawBar();
  }, function(m){ x.unstocking = false; BAR_ERR = m; drawBar(); });
}
function clearBar(){ clearTimeout(timer); QUEUE = []; BAR_OPEN = false; BAR_ERR = ''; LAST_HD = LAST_LS = ''; drawBar(); load(); }
function openSheet(h){ $('sheetIn').innerHTML = h; $('sheet').style.display = 'flex'; }
function closeSheet(){ $('sheet').style.display = 'none'; }

setInterval(function(){ if (!document.hidden) call('ui_status', [[]], function(r){ drawDev(r && r.device); }, function(){}); }, 30000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) { call('ui_status', [[]], function(r){ drawDev(r && r.device); }, function(){}); poll(); } });
load();
</script>
</body>
