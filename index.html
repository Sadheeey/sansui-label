<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ラベル">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4f0">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ラベル発行</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#222;--sub:#777;--line:#e4e0d8;--main:#b23a2a;--ok:#2e7d4f;--ng:#c0392b;
  --frz:#2b6cb0;--frz-bg:#e8f1fb;--ref:#2f855a;--ref-bg:#e6f4ec;--amb:#b7791f;--amb-bg:#fbf1df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button,input{touch-action:manipulation} /* 連打してもズームしない */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:16px;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
nav{flex:none;padding:10px 10px 8px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:14px;color:var(--ink)}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
nav .sep{flex:none;width:1px;background:var(--line);margin:2px 2px}
nav button.st{padding:7px 11px}
nav button.st::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--c)}
nav button.st.on{background:var(--c);border-color:var(--c)}
nav button.st.on::before{background:#fff}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 10px 16px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.card.s-冷凍{border-left-color:var(--frz)}
.card.s-冷蔵{border-left-color:var(--ref)}
.card.s-常温{border-left-color:var(--amb)}
.card.has{box-shadow:0 0 0 2px var(--main) inset}
.top{display:flex;align-items:center;gap:8px}
.nm{flex:1;min-width:0}
.nm b{font-size:17px;line-height:1.3}
.nm small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:bold;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.tag.s-冷凍{color:var(--frz);background:var(--frz-bg)}
.tag.s-冷蔵{color:var(--ref);background:var(--ref-bg)}
.tag.s-常温{color:var(--amb);background:var(--amb-bg)}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#faf8f5;font-size:22px;line-height:1;color:var(--ink)}
.step input{width:56px;height:44px;text-align:center;font-size:20px;border:1px solid var(--line);border-radius:10px}
.spec{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.fl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fl label{font-size:13px;color:var(--sub);min-width:2.5em}
.fl .w{width:76px;height:44px;font-size:20px;text-align:center;border:1px solid var(--line);border-radius:10px}
.fl .d{height:44px;font-size:17px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:#fff}
.fl .u{font-size:14px;color:var(--sub)}
.gr{display:flex;align-items:center;gap:8px;padding:5px 0}
.gr .gw{flex:1;font-size:18px;font-weight:bold;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gr .gw small{font-size:13px;font-weight:normal;color:var(--sub)}
.gr .gw.kill{color:var(--ng)}
.gr.has .gw{color:var(--main)}
.hint{font-size:12px;color:var(--sub);margin:6px 0 2px}
#bar{flex:none;background:#fffaf2;border-top:1px solid var(--line);display:none}
#bar .hd{display:flex;align-items:center;gap:8px;padding:8px 10px}
#bar .hd .tx{flex:1;font-size:14px;line-height:1.35}
#bar .hd .tx small{display:block;color:var(--sub);font-size:12px}
#bar .tg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:13px}
#bar .ls{max-height:40vh;overflow-y:auto;padding:0 10px 6px;display:none}
#bar.open .ls{display:block}
#bar .nx{padding:9px 12px;font-size:14px}
.cnt{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.add{margin-top:8px;border:1px dashed var(--sub);background:none;border-radius:10px;padding:9px;width:100%;font-size:14px;color:var(--sub)}
.del{border:none;background:none;color:var(--sub);font-size:14px;padding:6px}
footer{flex:none;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
footer .sum{flex:1;font-size:13px;line-height:1.35}
footer .sum b{font-size:20px}
#dev{font-size:11px;color:var(--sub);white-space:nowrap}
.btn{border:none;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:bold}
.btn.main{background:var(--main);color:#fff}
.btn.sub{background:#fff;border:1px solid var(--main);color:var(--main)}
.btn:disabled{opacity:.35}
#sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#sheet .in{background:#fff;width:100%;max-height:85%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 10px;font-size:18px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1}
.row .t small{display:block;color:var(--sub);font-size:12px}
.row .c{font-weight:bold;white-space:nowrap}
.row .s{white-space:nowrap;font-size:14px}
.row .x{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:13px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts .btn{flex:1}
.msg{padding:10px;border-radius:10px;margin:8px 0;font-size:14px;white-space:pre-line}
.msg.ng{background:#fdecea;color:var(--ng)}
.msg.warn{background:#fff6e0;color:#7a5600}
.msg.ok{background:#e8f5ec;color:var(--ok)}
#load{padding:40px;text-align:center;color:var(--sub)}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="list"><div id="load">読み込み中…</div></main>
<div id="bar"><div class="hd" id="barHd"></div><div class="ls" id="barLs"></div></div>
<footer>
  <div class="sum">合計 <b id="sumN">0</b> 枚（<span id="sumK">0</span>件）<br><span id="dev">店のPC 確認中…</span></div>
  <button class="btn sub" id="bStep" disabled>1種類ずつ</button>
  <button class="btn main" id="bAll" disabled>まとめて印刷</button>
</footer>
<div id="sheet"><div class="in" id="sheetIn"></div></div>

<script>
// 受付（Apps Script）の住所。このページを別の場所に置いたときは、ここへ送る
var EXEC = 'https://script.google.com/macros/s/AKfycbxVxiq_zZ6LFz_cWhz-RmKAFZ2ccub7rMukNTPgRcwmVwTB3gzC7A7fm0Pg1Ume7xG0/exec'; // リポジトリには書かない。公開するときに受付のURLへ置き換える（Apps Scriptから開くときは使わない）
var D = null;            // ui_data の結果
var Q = {};              // 入力。欄なし：id → 枚数／欄あり：id → {grid:{重さ:枚数}, rows:[{v:{欄名:値}, n:枚数}], d:{期限の欄名:'YYYY-MM-DD'}}
var QUEUE = [];          // 印刷に回したもの {title, spec, payload, held, id, st, note}
var SENDING = false, BAR_OPEN = false, BAR_ERR = '', timer = null, filter = '', sfilter = '';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function han(s){ return String(s).replace(/[０-９ｇ．]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }); }
function clampN(v){ v = parseInt(han(v), 10); if (!isFinite(v) || v < 0) v = 0; return Math.min(v, D ? D.maxCopies : 200); }
function store(k, v){ try { if (v === undefined) return localStorage.getItem('label:' + k); localStorage.setItem('label:' + k, v); } catch (e) { return null; } }

// 受付を呼ぶ：Apps Script の中で開いたときは google.script.run、別ページのときは fetch
var FN = { ui_data: 'uiData', ui_enqueue: 'uiEnqueue', ui_status: 'uiStatus', ui_cancel: 'uiCancel' };
function call(action, args, ok, ng){
  var fail = function(e){ (ng || showErr)(String(e && e.message || e)); };
  if (!(window.google && google.script && google.script.run) && EXEC.indexOf('__') === 0) { fail('受付の住所が入っていません（公開の手順を確かめてください）'); return; }
  if (window.google && google.script && google.script.run) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
    r[FN[action]].apply(r, args || []);
    return;
  }
  var body = { action: action };
  if (action === 'ui_enqueue') { body.items = args[0]; body.source = args[1]; }
  if (action === 'ui_status') body.ids = args[0];
  if (action === 'ui_cancel') body.id = args[0];
  fetch(EXEC, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
    .then(function(res){ if (!res.ok) throw new Error('受付につながりません（' + res.status + '）'); return res.json().catch(function(){ throw new Error('受付の返事が読めません。少しして、もう一度押してください'); }); })
    .then(ok).catch(fail);
}
function showErr(m){ openSheet('<h3>うまくいきませんでした</h3><div class="msg ng">' + esc(m) + '</div><div class="acts"><button class="btn sub" onclick="closeSheet()">閉じる</button></div>'); }

/* ---------- 日付 ---------- */
function ymd(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function addDays(n){ var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + (n || 0)); return ymd(d); }
function labelDate(s){ var p = String(s).split('-'); return p.length === 3 ? (p[0].slice(2) + '.' + Number(p[1]) + '.' + Number(p[2])) : ''; } // 2026-12-07 → 26.12.7（数字の全角は受付でそろえる）

/* ---------- 読み込み ---------- */
function load(){
  call('ui_data', [], function(d){
    if (!d || !d.ok) { $('list').innerHTML = '<div class="msg ng">読み込めませんでした：' + esc(d && d.error) + '</div>'; return; }
    D = d; drawDev(d.device); drawNav(); draw(); sum();
  }, function(m){ $('list').innerHTML = '<div class="msg ng">読み込めませんでした：' + esc(m) + '</div>'; });
}
function drawDev(dv){
  var s = dv && dv.secondsAgo, t;
  if (s == null) t = '🔴 店のPC 不明';
  else if (s <= 30) t = '🟢 店のPC つながっています';
  else if (s <= 300) t = '🟡 店のPC ' + Math.round(s / 60 + 0.5) + '分前';
  else t = '🔴 店のPC 止まっているかも';
  $('dev').textContent = t;
  $('dev').dataset.bad = (s == null || s > 300) ? '1' : '';
}
// 絞り込みのボタンは短い名前にする（横に並べても場所をとらないように）
var SHORT = { '生ベーコン': 'ベーコン', '食べる焼豚タレ': 'タレ', '半熟味玉': '味玉', '醤蘿蔔': '大根', 'はしのはし': 'はし' };
var STORES = [['冷凍', 'var(--frz)'], ['冷蔵', 'var(--ref)'], ['常温', 'var(--amb)']];
function group(l){ var k = String(l.item || 'その他').replace(/（.*$/, '').replace(/\(.*$/, ''); return SHORT[k] || k; }
function shown(l){ return (!filter || group(l) === filter) && (!sfilter || l.storage === sfilter); }
function groups(){ var m = [], seen = {}; D.labels.forEach(function(l){ var k = group(l); if (!seen[k]) { seen[k] = 1; m.push(k); } }); return m; }
function drawNav(){
  var h = '';
  STORES.forEach(function(x){ h += '<button class="st' + (sfilter === x[0] ? ' on' : '') + '" style="--c:' + x[1] + '" data-s="' + x[0] + '">' + x[0] + '</button>'; });
  h += '<span class="sep"></span><button class="' + (filter ? '' : 'on') + '" data-k="">全部</button>';
  groups().forEach(function(k){ h += '<button class="' + (filter === k ? 'on' : '') + '" data-k="' + esc(k) + '">' + esc(k) + '</button>'; });
  $('nav').innerHTML = h;
}
$('nav').onclick = function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.s) sfilter = sfilter === b.dataset.s ? '' : b.dataset.s; // もう一度押すと解除
  else filter = b.dataset.k;
  drawNav(); draw(); $('list').scrollTop = 0;
};

/* ---------- 一覧 ---------- */
function lab(id){ for (var i = 0; i < D.labels.length; i++) if (D.labels[i].id === id) return D.labels[i]; return null; }
function numFields(l){ return l.fields.filter(function(f){ return f.kind === 'number'; }); }
function dateFields(l){ return l.fields.filter(function(f){ return f.kind === 'date'; }); }
// よく使う重さの一覧（数字の欄が1つだけのラベル）。軽い順、このスマホで消したものは出さない
function gridField(l){ var n = numFields(l); return n.length === 1 ? n[0] : null; }
function hidden(l, f){ try { return JSON.parse(store('hide:' + l.id + ':' + f.name) || '[]'); } catch (e) { return []; } }
function gridVals(l){
  var f = gridField(l); if (!f) return [];
  var hide = hidden(l, f);
  return (f.recent || []).filter(function(v){ return Number(v) >= 1 && hide.indexOf(String(v)) < 0; }).sort(function(a, b){ return Number(a) - Number(b); });
}
function newRow(l){ var v = {}; numFields(l).forEach(function(f){ v[f.name] = ''; }); return { v: v, n: 0 }; }
function state(l){
  if (!Q[l.id]) {
    var d = {}; dateFields(l).forEach(function(f){ d[f.name] = addDays(l.dateDays); });
    Q[l.id] = { grid: {}, rows: [newRow(l)], d: d };
  }
  return Q[l.id];
}
function draw(){
  var h = '';
  D.labels.forEach(function(l){ if (shown(l)) h += card(l); });
  $('list').innerHTML = h || '<div class="msg warn">出せるラベルがありません</div>';
}
function card(l){
  var fixed = !l.fields.length && l.content && l.content.charAt(0) !== '（' ? han(l.content).replace(/\s/g, '') : '';
  var h = '<div class="card s-' + esc(l.storage) + (count(l) ? ' has' : '') + '" id="c_' + l.id + '" data-id="' + l.id + '"><div class="top"><div class="nm"><b>' + esc(l.name) + '</b>' +
    (l.storage ? '<span class="tag s-' + esc(l.storage) + '">' + esc(l.storage) + '</span>' : '') + (fixed ? '<small>' + esc(fixed) + '</small>' : '') + '</div>';
  if (!l.fields.length) return h + stepper(Q[l.id] || 0, 'one', '') + '</div></div>';
  h += '</div>';
  var q = state(l), gf = gridField(l), gv = gridVals(l);
  dateFields(l).forEach(function(f){
    h += '<div class="fl" style="margin-top:8px"><label>' + esc(f.name) + '</label><input class="d" type="date" data-f="' + esc(f.name) + '" value="' + esc(q.d[f.name]) + '"><span class="u">' + esc(labelDate(q.d[f.name])) + '</span></div>';
  });
  if (gv.length) {
    h += '<div class="spec">';
    gv.forEach(function(v){
      var n = q.grid[v] || 0;
      h += '<div class="gr' + (n ? ' has' : '') + '"><span class="gw" data-gv="' + esc(v) + '">' + esc(v) + '<small>' + esc(gf.unit || '') + '</small></span>' + stepper(n, 'grid', v) + '</div>';
    });
    h += '<div class="hint">ほかの' + esc(gf.name) + '（長押しで上の候補を消せます）</div></div>';
  }
  var rows = q.rows;
  rows.forEach(function(r, i){
    h += '<div class="' + (gv.length ? '' : 'spec ') + 'rw" data-i="' + i + '"><div class="gr">';
    numFields(l).forEach(function(f){
      h += '<input class="w" inputmode="numeric" autocomplete="off" data-f="' + esc(f.name) + '" value="' + esc(r.v[f.name]) + '" placeholder="' + esc(f.name) + '"><span class="u">' + esc(f.unit || '') + '</span>';
    });
    h += '<span style="flex:1"></span>' + stepper(r.n, 'row', i) + '</div>' + (rows.length > 1 ? '<button class="del" data-del="' + i + '">✕ この行をけす</button>' : '') + '</div>';
  });
  if (numFields(l).length) h += '<button class="add">＋ 別の' + esc(numFields(l)[0].name) + 'を足す</button>';
  return h + '</div>';
}
function stepper(n, kind, key){
  return '<div class="step" data-k="' + kind + '" data-key="' + esc(key) + '"><button data-d="-1">−</button><input class="n" inputmode="numeric" autocomplete="off" value="' + (n || '') + '" placeholder="0"><button data-d="1">＋</button></div>';
}
function count(l){
  var q = Q[l.id]; if (!q) return 0; if (!l.fields.length) return q;
  var s = 0; for (var k in q.grid) s += q.grid[k] || 0;
  q.rows.forEach(function(r){ s += r.n || 0; }); return s;
}
function redrawCard(id){ var el = $('c_' + id); if (el) el.outerHTML = card(lab(id)); }
function setCount(l, kind, key, n){
  if (kind === 'one') Q[l.id] = n;
  else if (kind === 'grid') state(l).grid[key] = n;
  else state(l).rows[Number(key)].n = n;
}
function getCount(l, kind, key){
  if (kind === 'one') return Q[l.id] || 0;
  if (kind === 'grid') return state(l).grid[key] || 0;
  return state(l).rows[Number(key)].n || 0;
}

// 一覧の中の操作はここでまとめて受ける
$('list').addEventListener('click', function(e){
  var c = e.target.closest('.card'); if (!c) return;
  var l = lab(c.dataset.id);
  var gw = e.target.closest('.gw');
  if (gw && Date.now() - (window.__killAt || 0) < 500) return; // 長押しで指を離したときの1回は数えない
  if (gw && gw.classList.contains('kill')) { // 長押しのあと、もう一度押すと候補から消す
    var f = gridField(l), list = hidden(l, f); list.push(gw.dataset.gv); store('hide:' + l.id + ':' + f.name, JSON.stringify(list));
    delete state(l).grid[gw.dataset.gv]; redrawCard(l.id); sum(); return;
  }
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d) {
    var st = b.closest('.step'); setCount(l, st.dataset.k, st.dataset.key, clampN(getCount(l, st.dataset.k, st.dataset.key) + Number(b.dataset.d)));
  } else if (b.dataset.del != null) {
    state(l).rows.splice(Number(b.dataset.del), 1);
  } else if (b.classList.contains('add')) {
    state(l).rows.push(newRow(l));
  } else return;
  redrawCard(l.id); sum();
});
$('list').addEventListener('input', function(e){
  var c = e.target.closest('.card'); if (!c) return;
  var l = lab(c.dataset.id), t = e.target;
  if (t.classList.contains('n')) {
    var st = t.closest('.step'), n = clampN(t.value);
    setCount(l, st.dataset.k, st.dataset.key, n);
    if (t.value !== '' && String(n) !== t.value) t.value = n || '';
    var gr = t.closest('.gr'); if (gr && st.dataset.k === 'grid') gr.classList.toggle('has', n > 0);
    c.classList.toggle('has', count(l) > 0);
  } else if (t.classList.contains('w')) {
    var i = Number(t.closest('.rw').dataset.i), v = han(t.value).replace(/[^0-9]/g, '').slice(0, 4);
    state(l).rows[i].v[t.dataset.f] = v;
    if (t.value !== v) t.value = v;
  } else if (t.classList.contains('d')) {
    state(l).d[t.dataset.f] = t.value;
    t.nextElementSibling.textContent = labelDate(t.value);
  }
  sum();
});
// 数字の欄を触ったら中身を消して、すぐ打ち直せるようにする
$('list').addEventListener('focusin', function(e){
  var t = e.target;
  if (!t.classList.contains('n') && !t.classList.contains('w')) return;
  if (t.value === '') return;
  t.dataset.prev = t.value; t.value = '';
  t.dispatchEvent(new Event('input', { bubbles: true }));
});
$('list').addEventListener('focusout', function(e){
  var t = e.target;
  if ((t.classList.contains('n') || t.classList.contains('w')) && t.value === '' && t.dataset.prev) {
    t.value = t.dataset.prev; t.dispatchEvent(new Event('input', { bubbles: true }));
  }
  if (t.dataset) delete t.dataset.prev;
});
// 候補を長押しすると「消す？」に変わる（3秒以内にもう一度押すと消える）
var pressT = null, pressXY = null;
function pt(e){ var t = e.touches ? e.touches[0] : e; return t ? [t.clientX, t.clientY] : [0, 0]; }
function pressStart(e){
  var gw = e.target.closest('.gw'); if (!gw || gw.classList.contains('kill')) return;
  clearTimeout(pressT); pressXY = pt(e);
  pressT = setTimeout(function(){
    window.__killAt = Date.now(); window.__pressFired = true; gw.classList.add('kill'); gw.dataset.txt = gw.innerHTML; gw.innerHTML = '✕ 消す？ ' + esc(gw.dataset.gv);
    setTimeout(function(){ if (gw.isConnected && gw.classList.contains('kill')) { gw.classList.remove('kill'); gw.innerHTML = gw.dataset.txt; } }, 3000);
  }, 600);
}
function pressEnd(){ clearTimeout(pressT); if (window.__pressFired) { window.__killAt = Date.now(); window.__pressFired = false; } }
$('list').addEventListener('touchstart', pressStart, { passive: true });
$('list').addEventListener('mousedown', pressStart);
['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(function(ev){ $('list').addEventListener(ev, pressEnd); });
$('list').addEventListener('touchmove', function(e){ // 10px以上動いたら（スクロール）長押しをやめる
  if (!pressXY) return; var p = pt(e); if (Math.abs(p[0] - pressXY[0]) > 10 || Math.abs(p[1] - pressXY[1]) > 10) clearTimeout(pressT);
}, { passive: true });
$('list').addEventListener('contextmenu', function(e){ if (e.target.closest('.gw')) e.preventDefault(); });

/* ---------- 集める ---------- */
function collect(){
  var out = [], bad = [];
  D.labels.forEach(function(l){
    var q = Q[l.id]; if (!q) return;
    if (!l.fields.length) { if (q > 0) out.push({ label: l.id, values: {}, copies: q, title: l.name, spec: l.storage || '' }); return; }
    var dates = {}, dspec = [], dmiss = '';
    dateFields(l).forEach(function(f){ var x = labelDate(q.d[f.name]); if (!x) dmiss = dmiss || f.name; dates[f.name] = x; dspec.push(f.name + ' ' + x); });
    var push = function(nv, n, wspec){
      var v = {}; for (var k in nv) v[k] = nv[k]; for (var k2 in dates) v[k2] = dates[k2];
      out.push({ label: l.id, values: v, copies: n, title: l.name, spec: [wspec].concat(dspec).filter(Boolean).join('・') });
    };
    var gf = gridField(l);
    gridVals(l).forEach(function(gv){
      var n = q.grid[gv] || 0; if (!n) return;
      if (dmiss) { bad.push(l.name + '：' + dmiss + 'が入っていません'); return; }
      var nv = {}; nv[gf.name] = String(gv); push(nv, n, gv + (gf.unit || ''));
    });
    q.rows.forEach(function(r){
      if (!r.n) return;
      var miss = dmiss, ws = [];
      numFields(l).forEach(function(f){ var x = r.v[f.name]; if (!/^[0-9]{1,4}$/.test(x || '') || Number(x) < 1) miss = miss || f.name; else ws.push(x + (f.unit || '')); });
      if (miss) { bad.push(l.name + '：' + miss + 'が入っていません'); return; }
      push(r.v, r.n, ws.join('・'));
    });
  });
  return { items: out, bad: bad };
}
function sum(){
  if (!D) return;
  var c = collect(), n = c.items.reduce(function(a, x){ return a + x.copies; }, 0);
  $('sumN').textContent = n; $('sumK').textContent = c.items.length;
  $('bAll').disabled = $('bStep').disabled = !(n > 0 || c.bad.length); // 入れ忘れは押したときに知らせる
}

/* ---------- 確かめて印刷 ---------- */
$('bAll').onclick = function(){ confirmRun('all'); };
$('bStep').onclick = function(){ confirmRun('step'); };
function confirmRun(mode){
  var c = collect();
  if (c.bad.length) { showErr(c.bad.join('\n')); return; }
  var n = c.items.reduce(function(a, x){ return a + x.copies; }, 0);
  var h = '<h3>' + (mode === 'all' ? 'まとめて印刷' : '1種類ずつ印刷') + '（合計 ' + n + ' 枚）</h3>';
  if ($('dev').dataset.bad) h += '<div class="msg warn">店のPCとつながっていないようです。依頼は並びますが、PCが動くまで印刷されません。</div>';
  if (mode === 'step') h += '<div class="msg ok">最初の1種類だけ出します。下の帯の「次を印刷」で、次の種類を出します。\n※「次を待つ」の分は、この画面を閉じると消えます。</div>';
  c.items.forEach(function(x){ h += '<div class="row"><div class="t">' + esc(x.title) + '<small>' + esc(x.spec) + '</small></div><div class="c">' + x.copies + ' 枚</div></div>'; });
  h += '<div class="acts"><button class="btn sub" onclick="closeSheet()">戻る</button><button class="btn main" id="go">印刷する</button></div>';
  openSheet(h);
  $('go').onclick = function(){
    this.disabled = true;
    c.items.forEach(function(x, i){
      QUEUE.push({ title: x.title, spec: x.spec, copies: x.copies, payload: { label: x.label, values: x.values, copies: x.copies }, held: mode === 'step' && i > 0, id: null, st: '', note: '' });
    });
    Q = {}; closeSheet(); draw(); sum(); // 印刷中でも、すぐ次を入れられる
    sendPending();
  };
}

/* ---------- 印刷の様子（下の帯） ---------- */
function sendPending(){
  if (SENDING) return;
  var list = QUEUE.filter(function(x){ return !x.held && !x.retry && !x.id && !x.gone; }).slice(0, 50); // 受付は1回50件まで
  if (!list.length) { drawBar(); return; }
  SENDING = true; list.forEach(function(x){ x.sending = true; }); drawBar();
  call('ui_enqueue', [list.map(function(x){ return x.payload; }), '画面'], function(r){
    SENDING = false;
    list.forEach(function(x){ x.sending = false; });
    if (!r || !r.ok) { failSend(r && r.error, false); return; }
    list.forEach(function(x, i){ x.id = r.ids[i]; x.st = '待ち'; });
    BAR_ERR = ''; POLL_WAIT = 3000; STILL = 0; sendPending(); poll();
  }, function(m){ SENDING = false; list.forEach(function(x){ x.sending = false; }); failSend(m, true); });
}
// 送れなかった分は「送り直し待ち」にする（自動では送り直さない）。
// 通信が切れたときは、実は受付に届いていることがあるので、二重に刷らないよう注意を出す
function failSend(m, unsure){
  QUEUE.forEach(function(x){ if (!x.id && !x.gone && !x.held) x.retry = true; });
  BAR_ERR = unsure ? '通信が切れました。届いたか分かりません。店のPCで出ていないか確かめてから「送り直す」を押してください'
                   : (m || '送れませんでした');
  BAR_OPEN = true; drawBar();
}
function resend(){ if (SENDING) return; QUEUE.forEach(function(x){ x.retry = false; }); BAR_ERR = ''; sendPending(); }
function isEnd(s){ return s === '済み' || s === '失敗' || s === '取消' || s === '不明'; }
var POLL_WAIT = 3000, STILL = 0;
function poll(){
  clearTimeout(timer);
  var ids = QUEUE.filter(function(x){ return x.id && !isEnd(x.st); }).map(function(x){ return x.id; });
  if (!ids.length) { drawBar(); return; }
  call('ui_status', [ids], function(r){
    var jobs = (r && r.jobs) || {}, changed = false;
    QUEUE.forEach(function(x){
      if (!x.id || isEnd(x.st)) return;
      if (jobs[x.id]) { if (x.st !== jobs[x.id].status) changed = true; x.st = jobs[x.id].status; x.note = jobs[x.id].note; }
      else if (r && r.ok) { x.st = '不明'; changed = true; } // 依頼の行が見つからない分は追わない
    });
    STILL = changed ? 0 : STILL + 1;
    POLL_WAIT = STILL < 20 ? 3000 : Math.min(POLL_WAIT * 2, 30000); // 1分ほど動きがないときだけ間隔を延ばす（PCが止まっているとき）
    drawDev(r && r.device); drawBar();
    timer = setTimeout(poll, POLL_WAIT);
  }, function(){ POLL_WAIT = Math.min(POLL_WAIT * 2, 30000); timer = setTimeout(poll, POLL_WAIT); });
}
var MARK = { '待ち': '⏳ 待ち', '印刷中': '🖨 印刷中', '済み': '✅ 済み', '失敗': '❌ 失敗', '取消': '— 取消', '不明': '？ 不明' };
var LAST_HD = '', LAST_LS = '';
function live(){ return QUEUE.filter(function(x){ return !x.gone; }); }
function drawBar(){
  var q = live(), bar = $('bar');
  if (!q.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'block'; bar.classList.toggle('open', BAR_OPEN);
  var done = q.filter(function(x){ return x.st === '済み'; }).length;
  var held = q.filter(function(x){ return x.held; });
  var retry = q.filter(function(x){ return x.retry; });
  var bad = q.filter(function(x){ return x.st === '失敗' || x.st === '不明'; });
  var busy = q.some(function(x){ return x.sending || (x.id && !isEnd(x.st)) || (!x.id && !x.held && !x.retry); });
  var sheets = q.filter(function(x){ return x.st === '済み'; }).reduce(function(a, x){ return a + x.copies; }, 0);
  var tx, acts = '';
  if (retry.length) {
    tx = '⚠️ 送れていない分が ' + retry.length + '件 あります';
    acts = '<button class="btn main nx" ' + (SENDING ? 'disabled' : '') + ' onclick="resend()">送り直す</button>';
  } else if (!busy && !held.length) {
    tx = bad.length ? '❌ ' + bad.length + '件 うまく刷れていません（済み ' + done + '/' + q.length + '件）' : '✅ 全部おわりました（' + done + '/' + q.length + '件・' + sheets + '枚）';
    if (bad.length) BAR_OPEN = true;
    acts = '<button class="btn sub nx" onclick="clearBar()">閉じる</button>';
  } else {
    tx = '🖨 印刷：済み ' + done + '/' + q.length + '件' + (held.length ? '<small>次：' + esc(held[0].title) + ' ' + esc(held[0].spec) + ' ×' + held[0].copies + '</small>' : '');
    if (held.length) acts = '<button class="btn main nx" ' + (SENDING ? 'disabled' : '') + ' onclick="nextOne()">次を印刷</button>';
  }
  if (BAR_ERR) tx += '<small style="color:var(--ng)">' + esc(BAR_ERR) + '</small>';
  var hd = '<div class="tx">' + tx + '</div>' + acts + '<button class="tg" onclick="toggleBar()">' + (BAR_OPEN ? '▼' : '▲ 一覧') + '</button>';
  if (hd !== LAST_HD) { $('barHd').innerHTML = hd; LAST_HD = hd; } // 中身が同じなら作り直さない（押している最中に消えないように）
  bar.classList.toggle('open', BAR_OPEN);
  var h = '';
  q.forEach(function(x, i){
    var s = x.retry ? '⚠️ 送り直し待ち' : x.held ? '⏸ 次を待つ' : x.sending ? '送信中' : x.cancelling ? '取消中' : esc(MARK[x.st] || x.st || '…');
    var canX = !x.cancelling && (x.held || x.retry || x.st === '待ち');
    h += '<div class="row"><div class="t">' + esc(x.title) + '<small>' + esc(x.spec) + (x.st === '失敗' && x.note ? ' ' + esc(x.note) : '') + '</small></div><div class="c">' + x.copies + ' 枚</div><div class="s">' + s + '</div>' +
      (canX ? '<button class="x" onclick="cancelOne(' + QUEUE.indexOf(x) + ')">取消</button>' : '') + '</div>';
  });
  if (h !== LAST_LS) { $('barLs').innerHTML = h; LAST_LS = h; }
}
function toggleBar(){ BAR_OPEN = !BAR_OPEN; drawBar(); }
function nextOne(){
  if (SENDING) return;
  var x = QUEUE.filter(function(y){ return y.held && !y.gone; })[0]; if (!x) return;
  x.held = false; BAR_ERR = ''; sendPending();
}
function cancelOne(k){
  var x = QUEUE[k]; if (!x) return;
  if (x.held || x.retry) { x.gone = true; drawBar(); return; }   // まだ送っていない分は、ここで消すだけ
  if (x.st !== '待ち' || x.cancelling) return;
  x.cancelling = true; drawBar();
  call('ui_cancel', [x.id], function(r){ x.cancelling = false; if (r && r.ok) x.st = '取消'; BAR_ERR = r && r.ok ? '' : (r && r.error) || ''; POLL_WAIT = 3000; poll(); },
    function(m){ x.cancelling = false; BAR_ERR = m; poll(); });
}
function clearBar(){ clearTimeout(timer); QUEUE = []; BAR_OPEN = false; BAR_ERR = ''; LAST_HD = LAST_LS = ''; drawBar(); load(); }
function openSheet(h){ $('sheetIn').innerHTML = h; $('sheet').style.display = 'flex'; }
function closeSheet(){ $('sheet').style.display = 'none'; }

setInterval(function(){ if (!document.hidden) call('ui_status', [[]], function(r){ drawDev(r && r.device); }, function(){}); }, 30000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) { call('ui_status', [[]], function(r){ drawDev(r && r.device); }, function(){}); poll(); } });
load();
</script>
